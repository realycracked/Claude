name: Build APK Nova

# Construit l'application Android (APK) automatiquement, sans ordinateur.
# Se lance à chaque push sur la branche, ou manuellement (bouton "Run workflow").
on:
  push:
    branches:
      - claude/iptv-netflix-player-9yr0lk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Générer les dossiers natifs (android)
        run: flutter create . --org com.nova --platforms=android

      - name: Restaurer le manifeste IPTV/TV
        # flutter create écrase le manifeste : on remet le nôtre (Internet + Android TV).
        run: git checkout -- android/app/src/main/AndroidManifest.xml || true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Construire l'APK (release)
        run: flutter build apk --release

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
